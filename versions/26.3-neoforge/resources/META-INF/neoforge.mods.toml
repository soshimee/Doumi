modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0-or-later"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"
